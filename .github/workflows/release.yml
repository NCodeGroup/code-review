name: Release

# Tags the tip of main as an exact version and publishes its notes. Run it by hand, from main, with the version to
# release. The "Protect release tags" ruleset forbids updating or deleting a v* tag, so a tag made here can never be
# moved or removed; this workflow therefore checks everything before it creates one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, such as 0.1.0 (no leading v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$VERSION' isn't MAJOR.MINOR.PATCH, such as 0.1.0."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is new and the version is the next one
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists, and a release tag can't be changed."
            exit 1
          fi
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::$VERSION isn't newer than the latest release, $latest."
            exit 1
          fi
          echo "Releasing $tag${latest:+ after v$latest}."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The release's notes are its section of CHANGELOG.md, which must exist, dated, before the tag does.
      - name: Check the changelog has the version's section
        run: node tools/release-notes.ts "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      # The same checks as CI, on the commit about to be tagged: a tag can't be undone.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      - name: Tag and publish
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            ${{ startsWith(inputs.version, '0.') && '--prerelease' || '' }}
