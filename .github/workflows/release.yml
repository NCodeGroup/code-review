name: Release (manual)

# Tags the tip of main as an exact version, signed with gitsign in a public repository as tag-release.yml signs its
# tags, and publishes its notes. Run it by hand, from main, with the version to release. The "Protect release tags"
# ruleset forbids updating or deleting a v* tag, so a tag made here can never be moved or removed; this workflow
# therefore checks everything before it creates one. The checks run in a job that can only read, and the tag is made
# in a second job that runs no npm, so no installed package runs where a token can push or sign.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, such as 0.1.0 (no leading v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # tools/release-notes.ts checks the same pattern; keep the two in step.
      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$VERSION' isn't MAJOR.MINOR.PATCH, such as 0.1.0."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is new and the version is the next one
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists, and a release tag can't be changed."
            exit 1
          fi
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::$VERSION isn't newer than the latest release, $latest."
            exit 1
          fi
          echo "Releasing $tag${latest:+ after v$latest}."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The release's notes are its section of CHANGELOG.md, which must exist, dated, before the tag does.
      - name: Check the changelog has the version's section
        run: node tools/release-notes.ts "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      # The same checks as CI, on the commit about to be tagged: a tag can't be undone.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  release:
    name: Tag and publish
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # To sign the tag with gitsign through the job's OIDC token (the template's ADR-0028), as tag-release.yml does.
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # tools/release-notes.ts imports only Node's built-in modules, so this job installs and runs no package.
      - name: Write the release notes
        run: node tools/release-notes.ts "$VERSION" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      # A public repository's tag is signed through Sigstore's keyless signing; a private one's stays unsigned, since
      # Sigstore's public transparency log would publish its name (the template's ADR-0028).
      - uses: chainguard-dev/actions/setup-gitsign@d496b2ab65497cac13d77ccd5038b8aae7e8c43b # v1.8.2
        if: ${{ !github.event.repository.private }}

      # gh is git's credential helper for the push only, so no token sits in the checkout's git config. If the push
      # succeeds and the release fails, run Tag and publish release (tag-release.yml), which publishes it on the tag.
      - name: Tag and publish
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          SIGN: ${{ !github.event.repository.private }}
        run: |
          tag="v$VERSION"
          if [ "$SIGN" = true ]; then flag=-s; else flag=-a; fi
          git tag "$flag" "$tag" -m "$tag" "$GITHUB_SHA"
          gh auth setup-git
          git push origin "refs/tags/$tag"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            ${{ startsWith(inputs.version, '0.') && '--prerelease' || '' }}
