name: Code review

# Reviews each pull request with NCode Review (NCodeGroup/code-review), which posts as ncode-review[bot]: a "Code review"
# check run, a summary comment with a verdict, and inline threads. Nothing requires it; its findings are advice. It
# reviews a pull request when it opens (drafts included, since that's when its author reviews it) and when it's marked
# ready, unless that commit was already reviewed; pushes in between start nothing. A top-level `/review` comment from
# someone with write access reviews the latest commit on demand. A `skip-review` label skips the automatic reviews.
# When a pull request closes, merged or not, a release after v0.3.1 records what became of each finding (fixed,
# dismissed, acknowledged or ignored) in the summary comment, by rules alone: no review and no model call. Add `closed`
# to the types below in the same change that bumps the pin to such a release: v0.3.1 treats a closed pull request like
# an opened one and would pay to review it. The job's `if` and concurrency already handle `closed`.
#
# pull_request_target and issue_comment both run this file from the default branch, so a pull request can't change its
# own review. The engine fetches its code only to read it: nothing from it is built, run or installed.
#
# This file is yours: template updates show their changes to it and leave your copy alone, so a pin you bumped isn't
# moved back. The action is pinned to a release's full commit SHA, with its tag in a comment: never a tag, a branch or
# a floating major, because it receives the organization's keys, and a SHA is the one pin nobody can move (CodeQL's
# extended suite flags any other). Dependabot's github-actions entry opens each bump and updates the SHA and the tag.
# Run tools/Enable-CodeReview.ps1 from a clone of NCodeGroup/code-review once for this
# repository, which creates the code-review environment and gives it the organization's secrets.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # The engine checks a comment again (exactly `/review`, from a writer, on a pull request that isn't from a fork) and
    # stops before any model call when it isn't one. A closed pull request only records outcomes, whoever closed it (a
    # merge queue merges as a bot) and whatever its labels; the engine never reviews on `closed`.
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action == 'closed' ||
          (github.event.sender.type != 'Bot' && !contains(github.event.pull_request.labels.*.name, 'skip-review')))) ||
      (github.event_name == 'issue_comment' && github.event.sender.type != 'Bot' && github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # Anthropic's federation rule trusts only jobs in this environment, which only the default branch can deploy to.
    environment: code-review
    timeout-minutes: 30
    # Each /review explain or /review teach comment gets its own group, so it never cancels a review in progress. A closed
    # pull request's run waits for a review in progress, so its threads are counted, instead of cancelling it.
    concurrency:
      group: code-review-${{ (startsWith(github.event.comment.body, '/review explain') || startsWith(github.event.comment.body, '/review teach')) && format('command-{0}', github.event.comment.id) || github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event.action != 'closed' }}
    permissions:
      id-token: write
      contents: read
      # The issues a pull request closes are context for its intent.
      issues: read
      pull-requests: read
    steps:
      - name: Check out the default branch for the conventions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - name: Review
        uses: NCodeGroup/code-review@eaa9846049fdda1ce724fc34107391ba5f6d8708 # v0.3.1
        with:
          app-private-key: ${{ secrets.NCODE_REVIEW_APP_PRIVATE_KEY }}
          bedrock-api-key: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
