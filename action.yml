name: NCode code review
description: Reviews a pull request with Claude and posts the findings as the "Code review" check run (shadow mode).

inputs:
  app-private-key:
    description: The NCode Review app's private key (the NCODE_REVIEW_APP_PRIVATE_KEY organization secret).
    required: true
  bedrock-api-key:
    description: The Bedrock API key used once the plan's API credits run out (the AWS_BEARER_TOKEN_BEDROCK organization secret).
    required: false
    default: ''
  pr-path:
    description: Where the pull request's head is read, relative to the workspace. The engine fetches the reviewed commit into it, unless a workflow has already checked the head out there.
    required: false
    default: pr
  base-path:
    description: Where the default branch is checked out, relative to the workspace. Settings and conventions come from here.
    required: false
    default: base
  github-token:
    description: A read-only token (contents and pull requests, and issues to link findings to open issues), used to read the pull request a /review comment is on, the issues it closes and whether their authors can write to the repository, and the finding a /review explain or /review teach comment names, to fetch the pull request's head and the head the last review read, to read the pull request's comments and the earlier review threads, and to read the open issues.
    required: false
    default: ${{ github.token }}
  app-client-id:
    description: The NCode Review app's client ID.
    required: false
    default: Iv23liAbZt44tgephpLC
  federation-rule-id:
    description: The Anthropic federation rule the job logs in through.
    required: false
    default: fdrl_019dXaBRa2Zo1UazugiQwWZ3
  organization-id:
    description: The Anthropic organization.
    required: false
    default: e9301a37-092f-47c8-9b24-188808b1d576
  service-account-id:
    description: The Anthropic service account the federation rule maps to.
    required: false
    default: svac_012yav3w3rfhH5i9bAgoWLHe
  workspace-id:
    description: The Anthropic workspace that pays for the review.
    required: false
    default: wrkspc_019f5RLk5SG4XWE8XKwWFHZh

runs:
  using: composite
  steps:
    # The acknowledgement: a sign on the pull request within seconds, before setup-node and npm ci, which are most of the
    # wait. It runs with the runner's own node and no npm package, and continues on error: without it, the review runs
    # as before. This step holds only the read-only token and makes the review step's own decision, so a comment that
    # isn't a /review command from a writer, a fork, an automatic run on a commit already reviewed, or a closed pull
    # request gets nothing. Neither does /review explain or /review teach: they answer with a comment, not the "Code
    # review" check run.
    - name: Decide whether to acknowledge
      id: ack-decide
      continue-on-error: true
      shell: bash
      env:
        CODE_REVIEW_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/acknowledge.ts" decide

    # A token for the acknowledgement alone, which revokes it before it exits, so no app token is alive while the review
    # step and its agents run.
    - name: Get the app's token to acknowledge
      id: ack-token
      if: steps.ack-decide.outputs.acknowledge == 'true'
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write
        permission-pull-requests: write
        skip-token-revoke: true

    # 👀 on a /review comment, and the "Code review" check run in progress. Its id goes to the publish and finish steps
    # as a step output, never into the review step's environment.
    - name: Acknowledge
      id: ack
      if: steps.ack-token.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        CODE_REVIEW_APP_TOKEN: ${{ steps.ack-token.outputs.token }}
        CODE_REVIEW_HEAD_SHA: ${{ steps.ack-decide.outputs.head-sha }}
        CODE_REVIEW_COMMENT_ID: ${{ steps.ack-decide.outputs.comment-id }}
      run: node "$GITHUB_ACTION_PATH/src/acknowledge.ts" post

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      id: setup-node
      with:
        node-version: 24

    - name: Install the engine
      id: install
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    # The model credentials stay in this step's process; the agents it starts get a proxy address and a placeholder.
    # Neither the app's private key nor a token minted from it is in this step's environment.
    # For a comment that isn't a /review, /review explain or /review teach command from someone with write access, it stops
    # here and the later steps skip. For a closed pull request it records each finding's outcome by rules, with no model
    # call, so it gets no model key. After three automatic reviews with no comment from someone with write access, it
    # stops before any model call and sets `paused`, so the later steps post only the paused notice and complete an
    # acknowledged check run as paused.
    - name: Review
      id: review
      shell: bash
      env:
        CODE_REVIEW_GITHUB_TOKEN: ${{ inputs.github-token }}
        CODE_REVIEW_OUT: ${{ runner.temp }}/code-review
        CODE_REVIEW_PR_PATH: ${{ inputs.pr-path }}
        CODE_REVIEW_BASE_PATH: ${{ inputs.base-path }}
        CODE_REVIEW_BEDROCK_KEY: ${{ github.event.action != 'closed' && inputs.bedrock-api-key || '' }}
        CODE_REVIEW_FEDERATION_RULE_ID: ${{ inputs.federation-rule-id }}
        CODE_REVIEW_ORGANIZATION_ID: ${{ inputs.organization-id }}
        CODE_REVIEW_SERVICE_ACCOUNT_ID: ${{ inputs.service-account-id }}
        CODE_REVIEW_WORKSPACE_ID: ${{ inputs.workspace-id }}
      run: node "$GITHUB_ACTION_PATH/src/main.ts"

    # Minted after the agents have exited, for this repository only, and able to write only check runs and pull request
    # comments and review threads: to publish the review, a closed pull request's outcomes, the paused notice or a
    # /review explain or /review teach reply, or to complete the check run with why there's no review.
    - name: Get the app's token
      id: app-token
      if: >-
        always() && (steps.review.outputs.reviewed == 'true' || steps.review.outputs.outcomes == 'true' ||
          steps.review.outputs.paused == 'true' ||
          steps.review.outputs.answered == 'true' || steps.review.outputs.taught == 'true' ||
          steps.review.outputs.stopped == 'true' || steps.ack.outputs.check-run-id != '')
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        repositories: ${{ github.event.repository.name }}
        permission-checks: write
        permission-pull-requests: write

    # For /review teach only: a second token, able to write only issues, in the one repository the guidance issue opens
    # in (this one, or NCodeGroup/code-review for /review teach org). It is separate so a review never asks for issues
    # write, and it may fail: when the app lacks issues write there, or isn't installed there, the publish step replies
    # that it lacks the permission instead of opening the issue.
    - name: Get the app's token for the guidance issue
      id: issues-token
      if: steps.review.outputs.taught == 'true'
      continue-on-error: true
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ steps.review.outputs.guidance-owner }}
        repositories: ${{ steps.review.outputs.guidance-repository }}
        permission-issues: write

    - name: Publish
      id: publish
      if: >-
        steps.review.outputs.reviewed == 'true' || steps.review.outputs.outcomes == 'true' ||
          steps.review.outputs.paused == 'true' ||
          steps.review.outputs.answered == 'true' || steps.review.outputs.taught == 'true'
      shell: bash
      env:
        CODE_REVIEW_OUT: ${{ runner.temp }}/code-review
        CODE_REVIEW_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        CODE_REVIEW_ISSUES_TOKEN: ${{ steps.issues-token.outputs.token }}
        CODE_REVIEW_CHECK_RUN_ID: ${{ steps.ack.outputs.check-run-id }}
        CODE_REVIEW_CHECK_RUN_SHA: ${{ steps.ack.outputs.head-sha }}
      run: node "$GITHUB_ACTION_PATH/src/publish.ts"

    # Completes the check run when the publish step didn't, so it never stays in progress: neutral "Review budget used
    # up" when no provider was available, neutral "Review paused" when the loop limit paused an automatic review, failure
    # with the reason when the review failed, cancelled when the run was.
    - name: Finish the check run
      if: >-
        always() && steps.app-token.outcome == 'success' && steps.publish.outputs.check-completed != 'true' &&
          (steps.review.outputs.stopped == 'true' || steps.ack.outputs.check-run-id != '')
      shell: bash
      env:
        CODE_REVIEW_OUT: ${{ runner.temp }}/code-review
        CODE_REVIEW_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        CODE_REVIEW_CHECK_RUN_ID: ${{ steps.ack.outputs.check-run-id }}
        CODE_REVIEW_CHECK_RUN_SHA: ${{ steps.ack.outputs.head-sha }}
        CODE_REVIEW_SETUP_OUTCOME: ${{ steps.setup-node.outcome }}
        CODE_REVIEW_INSTALL_OUTCOME: ${{ steps.install.outcome }}
        CODE_REVIEW_REVIEW_OUTCOME: ${{ steps.review.outcome }}
        CODE_REVIEW_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
      run: node "$GITHUB_ACTION_PATH/src/finish.ts"

    - name: Upload the trace
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: code-review-trace
        path: ${{ runner.temp }}/code-review/trace.json
        retention-days: 30
        if-no-files-found: ignore
